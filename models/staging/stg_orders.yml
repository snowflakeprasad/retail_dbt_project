version: 2

models:
  - name: stg_orders

    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - unique  
          - not_null

      - name: product_id
        tests:
          - unique
          - not_null

      - name: order_date
        tests:
          - not_null

      - name: quantity
        tests:
          - not_null